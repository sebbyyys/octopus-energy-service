# Copy to /config/packages/octopus.yaml; see docs/home-assistant.md.
# Cumulative totals can be corrected downward. Never use total_increasing.
# Rolling period totals intentionally have no state_class/last_reset.
rest:
  - resource: !secret octopus_service_url
    method: GET
    headers:
      Authorization: !secret octopus_service_authorization
      Accept: application/json
    verify_ssl: true
    scan_interval: 300
    timeout: 20
    sensor:
      - name: Octopus Service Status
        unique_id: octopus_service_status
        availability: "{{ value_json is defined and value_json is mapping }}"
        value_template: >-
          {% if value_json is defined and value_json is mapping %}
            {{ 'stale' if value_json.get('stale', true) else
               ('ready' if value_json.get('available', false) else 'no_data') }}
          {% else %}unknown{% endif %}
        json_attributes:
          - available
          - stale
          - last_sync
          - latest_reading
          - currency
          - timezone
          - quality
      - name: Octopus Electricity Total
        unique_id: octopus_service_electricity_total_kwh
        availability: >-
          {{ value_json is defined and value_json is mapping and value_json.get('available', false) and not value_json.get('stale', true) and value_json.get('electricity', {}).get('total_kwh') is not none }}
        value_template: >-
          {{ value_json.get('electricity', {}).get('total_kwh') if value_json is defined and value_json is mapping and value_json.get('available', false) and not value_json.get('stale', true) and value_json.get('electricity', {}).get('total_kwh') is not none else 'unknown' }}
        device_class: energy
        unit_of_measurement: kWh
        state_class: total
      - name: Octopus Electricity Today
        unique_id: octopus_service_electricity_today_kwh
        availability: >-
          {{ value_json is defined and value_json is mapping and value_json.get('available', false) and not value_json.get('stale', true) and value_json.get('electricity', {}).get('today_kwh') is not none }}
        value_template: >-
          {{ value_json.get('electricity', {}).get('today_kwh') if value_json is defined and value_json is mapping and value_json.get('available', false) and not value_json.get('stale', true) and value_json.get('electricity', {}).get('today_kwh') is not none else 'unknown' }}
        device_class: energy
        unit_of_measurement: kWh
      - name: Octopus Electricity Yesterday
        unique_id: octopus_service_electricity_yesterday_kwh
        availability: >-
          {{ value_json is defined and value_json is mapping and value_json.get('available', false) and not value_json.get('stale', true) and value_json.get('electricity', {}).get('yesterday_kwh') is not none }}
        value_template: >-
          {{ value_json.get('electricity', {}).get('yesterday_kwh') if value_json is defined and value_json is mapping and value_json.get('available', false) and not value_json.get('stale', true) and value_json.get('electricity', {}).get('yesterday_kwh') is not none else 'unknown' }}
        device_class: energy
        unit_of_measurement: kWh
      - name: Octopus Electricity Month
