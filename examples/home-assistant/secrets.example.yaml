# Merge into /config/secrets.yaml; do not commit real URLs/tokens.
# Loopback is valid ONLY when HA can reach the service in the same host namespace.
# For another machine/container, use a reachable protected address (see docs).
octopus_service_url: "http://127.0.0.1:8080/v1/home-assistant"
octopus_service_authorization: "Bearer REPLACE_WITH_YOUR_LOCALLY_GENERATED_SERVICE_TOKEN"
