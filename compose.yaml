services:
  octopus:
    build:
      context: .
      target: runtime
    image: octopus-energy-service:local
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      OCTOPUS_DB_PATH: /app/data/octopus.sqlite3
    ports:
      - "${OCTOPUS_BIND_ADDRESS:-127.0.0.1}:8080:8080"
    volumes:
      - octopus-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
volumes:
  octopus-data:
