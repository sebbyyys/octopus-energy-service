# Validate the standalone API, HA OS app and HACS integration.
name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.6"
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run --locked ruff check .
      - run: uv run --locked pytest --cov=octopus_service --cov-report=term-missing
      - run: uv build --no-sources
      - name: Validate Compose without credentials
        run: cp .env.example .env && docker compose --env-file .env.example config --quiet
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build locked non-root runtime image (no publish)
        run: docker build --tag octopus-energy-service:ci .
  ha-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.6"
      - run: uv venv --python 3.14 .venv-ha
      - run: uv pip sync --python .venv-ha/bin/python tests/ha_integration/requirements.txt
      - run: PYTHONPATH=. .venv-ha/bin/python -m pytest tests/ha_integration -q --allow-hosts=127.0.0.1,::1
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
  haos-addon:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.6"
      - run: uv sync --locked --group dev
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build the exact Supervisor app context
        run: docker buildx build --platform '${{ matrix.platform }}' --build-arg BUILD_ARCH='${{ matrix.arch }}' --load --tag octopus-haos:ci addons/octopus_energy_service
      - name: Exercise authentication, empty-data semantics and persistent restart
        run: |
          uv run --locked python - <<'PY'
          import json, os, subprocess, time
          from secrets import token_urlsafe
          from pathlib import Path
          import httpx, yaml
          data = Path(os.environ['RUNNER_TEMP']) / 'octopus-app-data'
          data.mkdir(mode=0o700)
          config = yaml.safe_load(Path('addons/octopus_energy_service/config.yaml').read_text())
          token = token_urlsafe(32)
          options = dict(config['options'])
          options.update(service_token=token, api_key='', account_number='')
          path = data / 'options.json'
          path.write_text(json.dumps(options))
          path.chmod(0o600)
          subprocess.run(['docker', 'run', '-d', '--name', 'octopus-haos-smoke',
                          '-p', '127.0.0.1:18080:8080', '-v', f'{data}:/data', 'octopus-haos:ci'], check=True)
          client = httpx.Client(base_url='http://127.0.0.1:18080', timeout=10)
          try:
              for restart in (False, True):
                  if restart:
                      subprocess.run(['docker', 'restart', 'octopus-haos-smoke'], check=True)
                  deadline = time.monotonic() + 120
                  while True:
                      try:
                          if client.get('/health/live').status_code == 200:
                              break
                      except httpx.RequestError:
                          pass
                      assert time.monotonic() < deadline, 'App did not become healthy'
                      time.sleep(0.5)
                  assert client.get('/v1/status').status_code == 401
                  response = client.get('/v1/home-assistant', headers={'Authorization': 'Bearer ' + token})
                  response.raise_for_status()
                  snapshot = response.json()
                  assert snapshot['electricity']['total_kwh'] is None
                  assert snapshot['cost']['today_gbp'] is None
                  assert response.headers['cache-control'] == 'no-store'
              status = client.get('/v1/status', headers={'Authorization': 'Bearer ' + token}).json()
              assert status['configured'] is False
              subprocess.run(['docker', 'exec', 'octopus-haos-smoke', 'python', '-c',
                              "from pathlib import Path; assert list(Path('/data').rglob('*.sqlite3'))"], check=True)
              print('App HTTP smoke and persistent restart passed')
          finally:
              client.close()
              subprocess.run(['docker', 'stop', 'octopus-haos-smoke'], check=True)
          PY
